                const width = Math.max(1, Math.floor(rect.width));
                const height = Math.max(1, Math.floor(rect.height));
                window.ayaStudioPointerLockAnchor = {
                    clientX: event.clientX,
                    clientY: event.clientY,
                    localX: Math.max(0, Math.min(width - 1, Math.floor(event.clientX - rect.x))),
                    localY: Math.max(0, Math.min(height - 1, Math.floor(event.clientY - rect.y))),
                    width,
                    height,
                    serial: ++pointerLockAnchorSerial
                };
            };
            const beginPointerGesture = event => {
                if (!isInRenderCanvasRect(event))
                    return;

                if (event.button === 2) {
                    capturePointerLockAnchor(event);
                    pointerLockController.setRightDown(true, true);
                } else if (event.pointerType !== 'touch' && pointerLockController.desired() && !pointerLockController.active()) {
                    pointerLockController.request(true);
                }
                focusQtSurface(event.clientX, event.clientY);
            };
            document.addEventListener(window.PointerEvent ? 'pointerdown' : 'mousedown', beginPointerGesture, true);

            document.addEventListener('contextmenu', event => {
                if (isInRenderCanvasRect(event))
                    event.preventDefault();
            }, true);

            document.addEventListener(window.PointerEvent ? 'pointerup' : 'mouseup', event => {
                if (event.button === 2)
                    pointerLockController.setRightDown(false);
            }, true);
            document.addEventListener('pointerlockchange', pointerLockController.pointerLockChanged, true);
            document.addEventListener('pointerlockerror', pointerLockController.pointerLockFailed, true);
            window.addEventListener('blur', pointerLockController.forceExit);

            const showUi = (ui) => {
                const showScreen = screen === ui;
                screen.style.position = 'absolute';
                screen.style.display = 'block';
                screen.style.visibility = showScreen ? 'visible' : 'hidden';
                screen.style.pointerEvents = showScreen ? 'auto' : 'none';
                spinner.style.display = showScreen ? 'none' : 'grid';
                updateRenderCanvasDisplay();
                if (showScreen) {
                    forceQtResize();
                    resizeRenderCanvas();
                }
            };

            try {
                showUi(spinner);
                progress.style.display = 'block';
                ayaStudioRenderDownloadProgress();

                const navigationEntry = performance.getEntriesByType('navigation')[0];
                if (navigationEntry?.type === 'reload') {
                    let pageHideTime = 0;
                    try {
                        pageHideTime = Number.parseInt(
                            sessionStorage.getItem(ayaStudioLastPageHideKey) || '0', 10) || 0;
                        sessionStorage.removeItem(ayaStudioLastPageHideKey);
                    } catch (error) {
                    }

                    const elapsed = pageHideTime > 0 ? Math.max(0, Date.now() - pageHideTime) : 0;
                    const releaseDelay = Math.max(250, ayaStudioReloadReleaseDelayMs - elapsed);
                    status.textContent = 'Releasing the previous Studio instance...';
                    await new Promise(resolve => setTimeout(resolve, releaseDelay));
                    if (pageShuttingDown)
                        return;
                }

                try {
                    await ayaStudioPruneRuntimeCaches();
                    if (pageShuttingDown)
                        return;
                } catch (error) {
                    console.warn('[Aya Studio] Could not prune old runtime caches:', error);
                }

                const runtimeCache = await ayaStudioRuntimeCache();
                if (pageShuttingDown)
                    return;
                const wasmResponsePromise = ayaStudioCachedFetch(ayaStudioAsset('Aya.Studio.wasm'));
                const wasmModulePromise = wasmResponsePromise.then(ayaStudioCompileWasm);
                if (runtimeCache) {
                    await ayaStudioPrimeDataFile();
                    if (pageShuttingDown)
                        return;
                }

                await qtLoad({
                    locateFile: filename => ayaStudioAsset(filename),
                    qt: {
                        onLoaded: () => {
                            showUi(screen);
                            startQtStartupResizeWatch();
                        },
                        onExit: exitData =>
                        {
                            if (pageShuttingDown)
                                return;
                            let message = 'Application exit';
                            message += exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            message += exitData.text !== undefined ? ` (${exitData.text})` : '';
                            status.textContent = message;
                            progress.style.display = 'none';
                            showUi(spinner);
                        },
                        entryFunction: config => {
                            if (pageShuttingDown)
                                return Promise.reject(new Error('Page shutdown'));

                            return Promise.resolve(window.Studio_entry(config)).then(instance => {
                                if (pageShuttingDown) {
                                    instance?.PThread?.terminateAllThreads();
                                    throw new Error('Page shutdown');
                                }
                                qtInstance = instance;
                                installAsyncifyDiagnostics(instance);
                                return instance;
                            });
                        },
                        containerElements: [screen],
                        module: wasmModulePromise,
                    }
                });
            } catch (e) {
                if (pageShuttingDown)
                    return;
                console.error(e);
                console.error(e.stack);
                status.textContent = `Application failed to load: ${e.message || e}`;
                progress.style.display = 'none';
                showUi(spinner);
            }
        }
    </script>
    <script>
        document.write(`<script src="${ayaStudioAsset('Aya.Diagnostics.js')}"><\/script>`);
        document.write(`<script src="${ayaStudioAsset('Aya.Studio.js')}"><\/script>`);
        document.write(`<script src="${ayaStudioAsset('qtloader.js')}"><\/script>`);
    </script>
  </body>
</html>
